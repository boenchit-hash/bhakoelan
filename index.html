<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhakoolan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            color: white;
            margin-bottom: 15px;
            text-align: left;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: bold;
        }
        
        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            flex: 1;
            height: calc(100vh - 100px);
        }
        
        .left-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .right-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            text-align: center;
        }
        
        /* Video Styles */
        .video-large {
            height: 200px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .video-small {
            height: 100px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .video-large video, .video-small video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Small Videos Container */
        .small-videos-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }
        
        /* Preview Styles */
        .preview-large {
            height: 120px;
            background: #f8f8f8;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #ddd;
        }
        
        .preview-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .thumbnails {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .thumbnail {
            height: 70px;
            background: #f8f8f8;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: border-color 0.3s;
        }
        
        .thumbnail.active {
            border-color: #3498db;
        }
        
        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .thumbnail-label {
            text-align: center;
            font-size: 12px;
            margin-top: 5px;
            color: #666;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 10px;
            font-weight: bold;
            font-size: 12px;
            padding: 5px;
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            max-width: 80%;
            max-height: 80%;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
        }
        
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
        
        /* Manual Data Entry Layout Fix */
        .manual-preview-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .manual-thumbnails {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>böenchit</h1>
    </div>
    
    <div class="main-container">
        <!-- Left Section -->
        <div class="left-section">
            <!-- Introduction - Video Besar -->
            <div class="section">
                <div class="section-title">Introduction</div>
                <div class="video-large">
                    <video autoplay muted loop>
                        <source src="video/perkenalan.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
            
            <!-- Two Small Videos - Dipindah lebih ke bawah -->
            <div class="small-videos-container">
                <!-- Spreadsheet Management -->
                <div class="section">
                    <div class="section-title">Spreadsheet Management</div>
                    <div class="video-small" id="spreadsheet-video">
                        <video controls>
                            <source src="video/spreadsheetmanagement.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>
                
                <!-- Manual Data Entry -->
                <div class="section">
                    <div class="section-title">Manual Data Entry</div>
                    <div class="video-small" id="manual-video">
                        <video controls>
                            <source src="video/manualdatacentry.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Section -->
        <div class="right-section">
            <!-- Preview Spreadsheet Management -->
            <div class="section">
                <div class="section-title">Preview Spreadsheet Management</div>
                <div class="preview-large" id="preview-spreadsheet">
                    <img src="images/before_spreadsheetmanagement.jpg" alt="Preview Spreadsheet">
                </div>
                <div class="thumbnails">
                    <div class="thumbnail-item">
                        <div class="thumbnail active" data-preview="images/before_spreadsheetmanagement.jpg">
                            <img src="images/before_spreadsheetmanagement.jpg" alt="Before">
                        </div>
                        <div class="thumbnail-label">A</div>
                    </div>
                    <div class="thumbnail-item">
                        <div class="thumbnail" data-preview="images/after_spreadsheetmanagement.jpg">
                            <img src="images/after_spreadsheetmanagement.jpg" alt="After">
                        </div>
                        <div class="thumbnail-label">B</div>
                    </div>
                </div>
            </div>
            
            <!-- Preview Manual Data Entry - Layout disamakan dengan Spreadsheet -->
            <div class="section">
                <div class="section-title">Preview Manual Data Entry</div>
                <div class="preview-large" id="preview-manual">
                    <img src="images/before_manualdatacentry.jpg" alt="Preview Manual">
                </div>
                <div class="thumbnails">
                    <div class="thumbnail-item">
                        <div class="thumbnail active" data-preview="images/before_manualdatacentry.jpg">
                            <img src="images/before_manualdatacentry.jpg" alt="Before">
                        </div>
                        <div class="thumbnail-label">C</div>
                    </div>
                    <div class="thumbnail-item">
                        <div class="thumbnail" data-preview="images/after_manualdatacentry.jpg">
                            <img src="images/after_manualdatacentry.jpg" alt="After">
                        </div>
                        <div class="thumbnail-label">D</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        Professional Data Entry | Excel & Web Research | Accurate | Quick & Precise
    </div>
    
    <!-- Modal untuk Gambar -->
    <div class="modal" id="image-modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" src="" alt="Preview Image">
    </div>

    <script>
        // Thumbnail click functionality
        document.querySelectorAll('.thumbnail').forEach(thumb => {
            thumb.addEventListener('click', function() {
                const previewSrc = this.getAttribute('data-preview');
                const previewSection = this.closest('.section');
                const previewLarge = previewSection.querySelector('.preview-large img');
                
                // Update active thumbnail
                this.closest('.thumbnails').querySelectorAll('.thumbnail').forEach(t => {
                    t.classList.remove('active');
                });
                this.classList.add('active');
                
                // Update preview image
                previewLarge.src = previewSrc;
            });
        });
        
        // Image modal functionality
        const imageModal = document.getElementById('image-modal');
        const modalImage = imageModal.querySelector('img');
        
        document.querySelectorAll('.preview-large').forEach(preview => {
            preview.addEventListener('click', function() {
                const img = this.querySelector('img');
                modalImage.src = img.src;
                imageModal.style.display = 'flex';
            });
        });
        
        // Close modal
        document.querySelectorAll('.close-modal').forEach(closeBtn => {
            closeBtn.addEventListener('click', function() {
                imageModal.style.display = 'none';
            });
        });
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === imageModal) {
                imageModal.style.display = 'none';
            }
        });

        // Fix background image to show full content
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
        document.body.style.backgroundAttachment = "fixed";
    </script>
</body>
</html>
