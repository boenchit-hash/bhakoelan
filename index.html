<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhakoolan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 15px;
        }
        
        .container {
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
        }
        
        .section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 3px solid #3498db;
        }
        
        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #bdc3c7;
        }
        
        .video-container {
            flex: 1;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #000;
        }
        
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            height: 100px;
        }
        
        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid #bdc3c7;
            transition: all 0.3s ease;
        }
        
        .preview-image:hover {
            border-color: #3498db;
            transform: scale(1.05);
        }
        
        .preview-section {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .preview-row {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .preview-label {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .preview-letters {
            display: flex;
            gap: 40px;
        }
        
        .letter-item {
            text-align: center;
        }
        
        .letter {
            font-size: 2rem;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 5px;
        }
        
        .letter-label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
        }
        
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            transition: color 0.3s ease;
        }
        
        .close-modal:hover {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Introduction - Kiri Atas -->
        <div class="section" style="grid-column: 1; grid-row: 1;">
            <div class="section-title">Introduction</div>
            <div class="video-container">
                <video autoplay muted loop>
                    <source src="video/perkenalan.mp4" type="video/mp4">
                </video>
            </div>
        </div>
        
        <!-- Spreadsheet Management - Kanan Atas -->
        <div class="section" style="grid-column: 2; grid-row: 1;">
            <div class="section-title">Spreadsheet Management</div>
            <div class="video-container">
                <video controls>
                    <source src="video/spreadsheetmanagement.mp4" type="video/mp4">
                </video>
            </div>
            <div class="preview-container">
                <img src="images/before_spreadsheetmanajemen.jpg" alt="Before" class="preview-image" data-src="images/before_spreadsheetmanajemen.jpg">
                <img src="images/after_spreadsheetmanagement.jpg" alt="After" class="preview-image" data-src="images/after_spreadsheetmanagement.jpg">
            </div>
        </div>
        
        <!-- Manual Data Entry - Kiri Bawah -->
        <div class="section" style="grid-column: 1; grid-row: 2;">
            <div class="section-title">Manual Data Entry</div>
            <div class="video-container">
                <video controls>
                    <source src="video/manualdataentry.mp4" type="video/mp4">
                </video>
            </div>
            <div class="preview-container">
                <img src="images/before_manualdataentry.jpg" alt="Before" class="preview-image" data-src="images/before_manualdataentry.jpg">
                <img src="images/after_manualdataentry.jpg" alt="After" class="preview-image" data-src="images/after_manualdataentry.jpg">
            </div>
        </div>
        
        <!-- Preview Section - Kanan Bawah -->
        <div class="section" style="grid-column: 2; grid-row: 2;">
            <div class="section-title">Preview</div>
            <div class="preview-section">
                <div class="preview-row">
                    <div class="preview-label">Spreadsheet Management</div>
                    <div class="preview-letters">
                        <div class="letter-item">
                            <div class="letter">A</div>
                            <div class="letter-label">Before</div>
                        </div>
                        <div class="letter-item">
                            <div class="letter">B</div>
                            <div class="letter-label">After</div>
                        </div>
                    </div>
                </div>
                <div class="preview-row">
                    <div class="preview-label">Manual Data Entry</div>
                    <div class="preview-letters">
                        <div class="letter-item">
                            <div class="letter">C</div>
                            <div class="letter-label">Before</div>
                        </div>
                        <div class="letter-item">
                            <div class="letter">D</div>
                            <div class="letter-label">After</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal untuk gambar -->
    <div id="image-modal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-image">
    </div>
    
    <script>
        // Modal functionality for images
        const imageModal = document.getElementById('image-modal');
        const modalImage = document.getElementById('modal-image');
        const closeModal = document.querySelector('.close-modal');
        
        // Add click event to all preview images
        document.querySelectorAll('.preview-image').forEach(img => {
            img.addEventListener('click', function() {
                modalImage.src = this.getAttribute('data-src');
                imageModal.style.display = 'flex';
            });
        });
        
        // Close modal when clicking the X
        closeModal.addEventListener('click', function() {
            imageModal.style.display = 'none';
        });
        
        // Close modal when clicking outside the content
        window.addEventListener('click', function(event) {
            if (event.target === imageModal) {
                imageModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
