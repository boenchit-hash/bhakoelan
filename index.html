<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhakoolan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .container {
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 10px;
        }
        
        .section {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
            text-align: center;
        }
        
        .video-container {
            flex: 1;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            height: 120px;
        }
        
        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid #bdc3c7;
        }
        
        .preview-image:hover {
            border-color: #3498db;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
        
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Introduction -->
        <div class="section" style="grid-column: 1; grid-row: 1;">
            <div class="section-title">Introduction</div>
            <div class="video-container">
                <video autoplay muted loop>
                    <source src="video/perkenalan.mp4" type="video/mp4">
                </video>
            </div>
        </div>
        
        <!-- Spreadsheet Management -->
        <div class="section" style="grid-column: 2; grid-row: 1;">
            <div class="section-title">Spreadsheet Management</div>
            <div class="video-container">
                <video controls>
                    <source src="video/spreadsheetmanagement.mp4" type="video/mp4">
                </video>
            </div>
            <div class="preview-container">
                <img src="images/before_spreadsheetmanajemen.jpg" alt="Before" class="preview-image" data-src="images/before_spreadsheetmanajemen.jpg">
                <img src="images/after_spreadsheetmanagement.jpg" alt="After" class="preview-image" data-src="images/after_spreadsheetmanagement.jpg">
            </div>
        </div>
        
        <!-- Manual Data Entry -->
        <div class="section" style="grid-column: 1; grid-row: 2;">
            <div class="section-title">Manual Data Entry</div>
            <div class="video-container">
                <video controls>
                    <source src="video/manualdataentry.mp4" type="video/mp4">
                </video>
            </div>
            <div class="preview-container">
                <img src="images/before_manualdataentry.jpg" alt="Before" class="preview-image" data-src="images/before_manualdataentry.jpg">
                <img src="images/after_manualdataentry.jpg" alt="After" class="preview-image" data-src="images/after_manualdataentry.jpg">
            </div>
        </div>
        
        <!-- Preview Section -->
        <div class="section" style="grid-column: 2; grid-row: 2;">
            <div class="section-title">Preview</div>
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <div style="text-align: center; margin-bottom: 20px;">
                    <div style="font-weight: bold; margin-bottom: 10px;">Spreadsheet Management</div>
                    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <div style="text-align: center;">
                            <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 5px;">A</div>
                            <div>Before</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 5px;">B</div>
                            <div>After</div>
                        </div>
                    </div>
                </div>
                <div style="text-align: center;">
                    <div style="font-weight: bold; margin-bottom: 10px;">Manual Data Entry</div>
                    <div style="display: flex; gap: 20px;">
                        <div style="text-align: center;">
                            <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 5px;">C</div>
                            <div>Before</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 5px;">D</div>
                            <div>After</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal untuk gambar -->
    <div id="image-modal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-image">
    </div>
    
    <script>
        // Modal functionality for images
        const imageModal = document.getElementById('image-modal');
        const modalImage = document.getElementById('modal-image');
        const closeModal = document.querySelector('.close-modal');
        
        // Add click event to all preview images
        document.querySelectorAll('.preview-image').forEach(img => {
            img.addEventListener('click', function() {
                modalImage.src = this.getAttribute('data-src');
                imageModal.style.display = 'flex';
            });
        });
        
        // Close modal when clicking the X
        closeModal.addEventListener('click', function() {
            imageModal.style.display = 'none';
        });
        
        // Close modal when clicking outside the content
        window.addEventListener('click', function(event) {
            if (event.target === imageModal) {
                imageModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
