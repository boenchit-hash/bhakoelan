<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boenchit - we enter data, you unlock result</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            color: white;
            margin-bottom: 20px;
            text-align: left;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: bold;
        }
        
        .main-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            flex: 1;
            height: calc(100vh - 120px);
        }
        
        .left-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .right-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .section {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 15px;
            padding: 20px;
            /* IMPROVED: Shadow lebih soft dan elegant */
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            /* IMPROVED: Border lebih soft */
            border: 1.5px solid #e8e8e8;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        
        /* IMPROVED: Hover effect lebih smooth untuk section */
        .section:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            border-color: #3498db;
        }
        
        .section-title {
            /* IMPROVED: Font size lebih besar */
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
            transition: all 0.3s ease;
        }
        
        /* Video Styles */
        .video-large {
            height: 450px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            /* IMPROVED: Shadow untuk video */
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .videos-horizontal {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: auto;
        }
        
        .video-horizontal {
            height: 140px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #bdc3c7;
            /* IMPROVED: Shadow untuk video horizontal */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }
        
        /* IMPROVED: Hover effect lebih smooth untuk video */
        .video-horizontal:hover {
            transform: scale(1.03) translateY(-2px);
            border-color: #3498db;
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
        }
        
        .video-large video, .video-horizontal video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        /* Preview Styles */
        .preview-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .preview-large {
            height: 160px;
            background: #f8f8f8;
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid #bdc3c7;
            /* IMPROVED: Shadow untuk preview */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }
        
        /* IMPROVED: Hover effect lebih smooth untuk preview */
        .preview-large:hover {
            transform: scale(1.02) translateY(-2px);
            border-color: #3498db;
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.25);
        }
        
        .preview-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        
        .preview-large:hover img {
            transform: scale(1.05);
        }
        
        .thumbnails {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: auto;
        }
        
        .thumbnail {
            height: 80px;
            background: #f8f8f8;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #bdc3c7;
            /* IMPROVED: Shadow untuk thumbnail */
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
        }
        
        .thumbnail.active {
            border-color: #3498db;
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.3);
        }
        
        /* IMPROVED: Hover effect lebih smooth untuk thumbnail */
        .thumbnail:hover {
            border-color: #3498db;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(52, 152, 219, 0.25);
        }
        
        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        
        .thumbnail:hover img {
            transform: scale(1.08);
        }
        
        .thumbnail-label {
            text-align: center;
            font-size: 14px;
            margin-top: 8px;
            color: #2c3e50;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        
        .thumbnail-container:hover .thumbnail-label {
            color: #3498db;
        }
        
        .thumbnail-container {
            text-align: center;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            /* IMPROVED: Shadow untuk footer */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .footer:hover {
            background: rgba(0,0,0,0.5);
            transform: translateY(-2px);
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            max-width: 70%;
            max-height: 70%;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
            animation: scaleIn 0.3s ease;
        }
        
        @keyframes scaleIn {
            from { 
                opacity: 0;
                transform: scale(0.8);
            }
            to { 
                opacity: 1;
                transform: scale(1);
            }
        }
        
        #video-modal .modal-content {
            width: 70%;
            max-width: 800px;
        }
        
        .close-modal {
            position: absolute;
            top: 25px;
            right: 35px;
            color: white;
            font-size: 45px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 1001;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .close-modal:hover {
            color: #e74c3c;
            transform: scale(1.1);
        }

        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .video-section-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
    </style>
</head>
<body>
   <div class="header">
    <h1><span style="font-size: 32px; font-weight: bold; color: gold;">boenchit</span></h1>
    <h2 style="font-size: 16px; margin-top: 5px; font-weight: normal; color: gold;">we enter data, you unlock result</h2>
</div>
    
    <div class="main-container">
        <!-- Left Section - Videos -->
        <div class="left-section">
            <!-- Introduction - Video Besar -->
            <div class="section video-section-container">
                <div class="section-title">Introduction</div>
                <div class="video-large">
                    <video autoplay muted loop>
                        <source src="video/perkenalan.mp4" type="video/mp4">
                    </video>
                </div>
                
                <!-- Two Videos Horizontal -->
                <div class="videos-horizontal" style="margin-top: auto;">
                    <div>
                        <div class="section-title">Spreadsheet Management</div>
                        <div class="video-horizontal" id="spreadsheet-video">
                            <video>
                                <source src="video/spreadsheetmanajemen.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                    <div>
                        <div class="section-title">Manual Data Entry</div>
                        <div class="video-horizontal" id="manual-video">
                            <video>
                                <source src="video/manualdataentry.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Section - Previews -->
        <div class="right-section">
            <!-- Preview Spreadsheet Management -->
            <div class="section preview-section">
                <div class="section-title">Preview Spreadsheet Management</div>
                <div class="preview-container">
                    <div class="preview-large" id="preview-spreadsheet">
                        <img src="images/before_spreadsheetmanajemen.jpg" alt="Preview Spreadsheet">
                    </div>
                    <div class="thumbnails">
                        <div class="thumbnail-container">
                            <div class="thumbnail active" data-preview="images/before_spreadsheetmanajemen.jpg">
                                <img src="images/before_spreadsheetmanajemen.jpg" alt="Before">
                            </div>
                            <div class="thumbnail-label">Before</div>
                        </div>
                        <div class="thumbnail-container">
                            <div class="thumbnail" data-preview="images/after_spreadsheetmanajemen.jpg">
                                <img src="images/after_spreadsheetmanajemen.jpg" alt="After">
                            </div>
                            <div class="thumbnail-label">After</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Preview Manual Data Entry -->
            <div class="section preview-section">
                <div class="section-title">Preview Manual Data Entry</div>
                <div class="preview-container">
                    <div class="preview-large" id="preview-manual">
                        <img src="images/before_manualdataentry.jpg" alt="Preview Manual">
                    </div>
                    <div class="thumbnails">
                        <div class="thumbnail-container">
                            <div class="thumbnail active" data-preview="images/before_manualdataentry.jpg">
                                <img src="images/before_manualdataentry.jpg" alt="Before">
                            </div>
                            <div class="thumbnail-label">Before</div>
                        </div>
                        <div class="thumbnail-container">
                            <div class="thumbnail" data-preview="images/after_manualdataentry.jpg">
                                <img src="images/after_manualdataentry.jpg" alt="After">
                            </div>
                            <div class="thumbnail-label">After</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        Professional Data Entry | Excel & Web Research | Accurate | Quick & Precise
    </div>
    
    <!-- Modal untuk Gambar -->
    <div class="modal" id="image-modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" src="" alt="Preview Image">
    </div>

    <!-- Modal untuk Video -->
    <div class="modal" id="video-modal">
        <span class="close-modal">&times;</span>
        <video class="modal-content" controls>
            <source src="" type="video/mp4">
        </video>
    </div>

    <script>
        // Thumbnail click functionality
        document.querySelectorAll('.thumbnail').forEach(thumb => {
            thumb.addEventListener('click', function() {
                const previewSrc = this.getAttribute('data-preview');
                const previewSection = this.closest('.section');
                const previewLarge = previewSection.querySelector('.preview-large img');
                
                // Update active thumbnail
                this.closest('.thumbnails').querySelectorAll('.thumbnail').forEach(t => {
                    t.classList.remove('active');
                });
                this.classList.add('active');
                
                // Update preview image
                previewLarge.src = previewSrc;
            });
        });
        
        // Image modal functionality
        const imageModal = document.getElementById('image-modal');
        const modalImage = imageModal.querySelector('img');
        
        document.querySelectorAll('.preview-large').forEach(preview => {
            preview.addEventListener('click', function() {
                const img = this.querySelector('img');
                modalImage.src = img.src;
                imageModal.style.display = 'flex';
            });
        });

        // VIDEO MODAL FUNCTIONALITY
        const videoModal = document.getElementById('video-modal');
        const modalVideo = videoModal.querySelector('video');
        
        document.querySelectorAll('.video-horizontal').forEach(videoContainer => {
            videoContainer.addEventListener('click', function() {
                const video = this.querySelector('video');
                const videoSource = video.querySelector('source').src;
                modalVideo.src = videoSource;
                videoModal.style.display = 'flex';
                modalVideo.play();
            });
        });
        
        // Close modal
        document.querySelectorAll('.close-modal').forEach(closeBtn => {
            closeBtn.addEventListener('click', function() {
                imageModal.style.display = 'none';
                videoModal.style.display = 'none';
                modalVideo.pause();
                modalVideo.currentTime = 0;
            });
        });
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === imageModal) {
                imageModal.style.display = 'none';
            }
            if (event.target === videoModal) {
                videoModal.style.display = 'none';
                modalVideo.pause();
                modalVideo.currentTime = 0;
            }
        });
    </script>
</body>
</html>
